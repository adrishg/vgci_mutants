[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cav12-ensemble-rmsf"
version = "1.0.0"
description = "Cluster workflow for full-protein AlphaFold ensemble RMSF of CaV1.2"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "biopython>=1.81",
  "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
