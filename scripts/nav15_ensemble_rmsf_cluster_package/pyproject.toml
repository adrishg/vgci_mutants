[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nav15-ensemble-rmsf"
version = "1.0.0"
description = "Cluster workflow for full-protein AlphaFold ensemble RMSF of Nav1.5"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "PyYAML>=6.0", "biopython>=1.81"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
